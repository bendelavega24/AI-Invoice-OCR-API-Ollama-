[theme]
# Modern Enterprise UI palette. The navigation rail is styled by
# ui/components/design_system.py for compatibility with Streamlit 1.38.
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17243B"
font = "sans serif"

[server]
# Single-PC mode: keep the app and its login on this computer.
address = "127.0.0.1"
port = 8501
headless = true

[browser]
# Address shown in the console and opened automatically. 0.0.0.0 is only a
# 'listen everywhere' setting and cannot be opened in a browser.
serverAddress = "localhost"
gatherUsageStats = false
